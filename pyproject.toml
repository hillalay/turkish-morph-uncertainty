[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-llm-morphology"
version = "0.1.0"
description = "Data contract for Turkish morphological uncertainty experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
